#@file Терминал kitty
# Строки #@ — разметка для mors-settings (configurator/): по ним рисуется окно настроек.

#@section Шрифт
# ---------- Шрифт ----------
#@name: Шрифт | type: string | desc: Название семейства, как в fc-list
font_family      Geist Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
#@name: Размер шрифта | type: float | range: 8-24 | step: 0.5
font_size        13.0
#@end

# ---------- Оболочка ----------
shell fish

# ---------- Внешний вид ----------
# цвета пишет ~/.config/rice/rice.py при смене темы
include theme.conf
#@section Окно
#@name: Непрозрачность фона | type: float | range: 0.5-1 | step: 0.05 | desc: 1 — без прозрачности
background_opacity   1.0
#@name: Внутренний отступ | type: int | range: 0-40 | desc: От края окна до текста, пикс.
window_padding_width 5
#@name: Без рамки окна | type: bool
hide_window_decorations yes
#@name: Шлейф курсора | type: enum | options: 0, 1, 3, 10 | desc: 0 — выключен; число — через сколько мс неподвижности шлейф появляется
cursor_trail 1
#@end

# Вкладки (Ctrl+Shift+T — новая, Ctrl+Shift+←/→ — переключение)
#@section Вкладки
#@name: Где панель вкладок | type: enum | options: bottom, top
tab_bar_edge  bottom
#@name: Стиль вкладок | type: enum | options: powerline, slant, separator, fade, hidden
tab_bar_style powerline
#@name: Форма powerline | type: enum | options: slanted, angled, round
tab_powerline_style slanted
#@end

# ---------- Поведение ----------
#@section Поведение
#@name: Спрашивать при закрытии | type: enum | options: 0, 1, -1 | desc: 0 — никогда, 1 — всегда, -1 — если что-то запущено
confirm_os_window_close 0
#@name: Звуковой сигнал | type: bool
enable_audio_bell no
#@name: Копировать при выделении | type: enum | options: clipboard, no
copy_on_select clipboard
#@name: История прокрутки | type: int | range: 1000-100000 | step: 1000 | desc: Сколько строк хранить
scrollback_lines 10000
#@end
allow_remote_control yes
listen_on unix:@kitty

# Ctrl+Shift+F5 — перечитать этот конфиг без перезапуска
